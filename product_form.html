{% extends "base.html" %}{% block title %}Product editor — FORME{% endblock %}{% block content %}<div class="login-wrap wide"><p class="eyebrow">CATALOGUE</p><h1>{% if product.id %}Edit product{% else %}Add product{% endif %}</h1><form method="post" class="checkout-form"><label>Product name<input name="name" value="{{ product.name or '' }}" required></label><label>Category<input name="category" value="{{ product.category or 'Shirts' }}" required placeholder="Shirts, T-Shirts, Jeans..."></label><label>Description<textarea name="description" rows="3">{{ product.description or '' }}</textarea></label><label>Price (₹)<input name="price" type="number" min="0" step="1" value="{{ product.price or '' }}" required></label><label>Image URL<input name="image" value="{{ product.image or '' }}" placeholder="https://..."></label><label>Sizes (comma separated)<input name="sizes" value="{{ product.sizes or 'S,M,L,XL' }}"></label><label>Stock quantity<input name="stock" type="number" min="0" value="{{ product.stock if product.stock is not none else 0 }}"></label><label class="check-label"><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> Feature on homepage</label><button class="btn btn-dark full">Save product</button></form></div>{% endblock %}
